
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABA 프로그램 로그인</title>
<style>body{margin:0;background:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}.box{width:min(420px,calc(100% - 32px));margin:11vh auto;background:#fff;border:1px solid #dde3ea;border-radius:16px;padding:28px;box-shadow:0 18px 50px rgba(31,41,55,.12)}h1{margin:0 0 6px}.sub{color:#667085;margin-bottom:22px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dde3ea;border-radius:8px;margin:6px 0 12px}.btn{width:100%;padding:11px;border:0;border-radius:8px;background:#2f6fda;color:#fff;font-weight:800}.flash{padding:10px;background:#fff1f1;color:#b42318;border-radius:8px;margin-bottom:12px;font-size:13px}</style></head>
<body><div class="box"><h1>ABA 프로그램</h1><div class="sub">Sensoryel ABA 프로그램 기록 시스템</div>
{% with messages=get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endif %}{% endwith %}
<form method="post"><label>아이디<input name="username" required></label><label>비밀번호<input name="password" type="password" required></label><button class="btn">로그인</button></form></div></body></html>
